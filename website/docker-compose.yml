services:
  website:
    image: lipanski/docker-static-website:latest
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - .:/home/static
    labels:
        - "traefik.http.routers.website.rule=Host(`www.lightuprising.org`)"
        - "traefik.http.routers.website.tls.certResolver=default"
    networks:
      - traefik_web
networks:
  traefik_web:
    external: true
